name: Desktop AppImage

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

# Repo-wide serialization: one workflow run executes at a time,
# later runs queue behind it (cancel-in-progress keeps queued runs alive).
concurrency:
  group: metrolist-serial
  cancel-in-progress: false

jobs:
  appimage:
    name: Build desktop AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Install AppImage build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools desktop-file-utils

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew packaging/appimage.sh

      - name: Build desktop uber jar
        run: ./gradlew --console=plain :desktopApp:packageUberJarForCurrentOS --warning-mode summary

      - name: Assemble AppImage
        run: ./packaging/appimage.sh

      - name: Smoke test (extract and inspect the AppImage)
        run: |
          ./build/appimage/Metrolist-x86_64.AppImage --appimage-extract
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/lib/metrolist.jar
          squashfs-root/usr/lib/jre/bin/java -version

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-x86_64
          path: build/appimage/Metrolist-x86_64.AppImage
          if-no-files-found: error
