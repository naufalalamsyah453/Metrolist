name: Desktop AppImage

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

# Repo-wide serialization: one workflow run executes at a time,
# later runs queue behind it (cancel-in-progress keeps queued runs alive).
concurrency:
  group: metrolist-serial
  cancel-in-progress: false

jobs:
  appimage:
    name: Build desktop AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Install AppImage build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools desktop-file-utils xvfb

      # Phase 3a/3b: mpv CLI decodes 5s of a real stream (--ao=null), and
      # MpvLibraryTest drives the same decode path through libmpv + JNA.
      - name: Install mpv and libmpv (playback spikes)
        run: sudo apt-get install -y -qq mpv libmpv2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew packaging/appimage.sh

      - name: Core tests (YouTube search, stream fetch, libmpv playback)
        run: ./gradlew --console=plain :shared:test :desktopApp:test --warning-mode summary

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: ignore

      - name: Build desktop uber jar
        run: ./gradlew --console=plain :desktopApp:packageUberJarForCurrentOS --warning-mode summary

      - name: Assemble AppImage
        run: ./packaging/appimage.sh

      - name: Smoke test (extract, inspect and launch the AppImage)
        run: |
          ./build/appimage/Metrolist-x86_64.AppImage --appimage-extract
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/lib/metrolist.jar
          squashfs-root/usr/lib/jre/bin/java -version
          # The Compose window must come up and stay up: 124 = still alive
          # when the timeout hit, anything else = crashed during startup.
          set +e
          timeout 20 xvfb-run -a ./squashfs-root/AppRun
          code=$?
          set -e
          echo "window smoke exit=$code (expected 124)"
          test "$code" -eq 124

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Metrolist-x86_64
          path: build/appimage/Metrolist-x86_64.AppImage
          if-no-files-found: error
